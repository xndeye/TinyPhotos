[package]
name = "tinyphotos"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Google Photos backup client built with Rust and GPUI"

[dependencies]
gpui-kit = "=0.9.1"
rfd = { version = "=0.17.2" }
dirs = "=7.0.0"
walkdir = "=2.5.0"
async-channel = "=2.5.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "gzip", "form"] }
prost = "=0.14.4"
sha1 = "=0.11.0"
base64 = "=0.23.1"
url = "=2.5.8"
rand = "=0.9.2"
serde_json = "1.0"

[build-dependencies]
winresource = "=0.1.34"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSString", "NSURL"] }
objc2-quick-look-thumbnailing = "=0.3.2"
tempfile = "=3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
md5 = "=0.8.0"
mime_guess = "=2.0.5"
png = "=0.17.16"
zbus = "=5.19.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
